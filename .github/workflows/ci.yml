name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff check
        run: python -m ruff check drissionpage_mcp tests playground
      - name: Validate versioned Skills catalog
        run: python playground/validate_skills.py --json
      - name: Mypy check
        run: python -m mypy drissionpage_mcp
      - name: Enforce 0.9.0 production LOC delta
        run: |
          # Release-relative: 0.8.9 candidate, not cumulative 0.8.8 growth.
          BASELINE=c1f9dde
          NET_PRODUCTION_LOC="$({
            git diff --numstat "$BASELINE" HEAD -- \
              ':(glob)drissionpage_mcp/**/*.py'
          } | awk '{ added += $1; deleted += $2 } END { print added - deleted }')"
          echo "Production LOC net growth from $BASELINE: $NET_PRODUCTION_LOC"
          test "$NET_PRODUCTION_LOC" -le 150

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Parse pyproject
        run: python -c "import tomllib; tomllib.load(open('pyproject.toml','rb'))"
        if: matrix.python-version != '3.10'
      - name: Parse pyproject on Python 3.10
        run: python -c "import tomli; tomli.load(open('pyproject.toml','rb'))"
        if: matrix.python-version == '3.10'
      - name: Run unit tests
        run: |
          python -m pytest \
            tests/test_server.py \
            tests/test_tools.py \
            tests/test_response_contract.py \
            tests/test_doctor.py \
            tests/test_mcp_compat.py \
            tests/test_skill_catalog.py \
            tests/test_tool_schema_snapshot.py \
            tests/test_release_metadata.py \
            tests/test_navigation_budget.py \
            tests/test_snapshot_search.py \
            tests/test_wait_budget.py \
            tests/test_playground_mcp_lab.py \
            tests/test_package_smoke.py \
            tests/test_ci_workflow.py

  protocol:
    name: MCP protocol tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run MCP protocol tests
        run: |
          python -m pytest \
            tests/test_mcp_protocol.py \
            tests/test_mcp_resources.py \

  evals:
    name: MCP eval harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run deterministic evals
        run: python -m pytest tests/evals -q

  benchmark:
    name: W01-W08 reliability benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Locate Chrome or Chromium
        run: |
          BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER_BIN" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
            BROWSER_BIN="$(command -v chromium || command -v chromium-browser || true)"
          fi
          test -n "$BROWSER_BIN"
          echo "CHROME_PATH=$BROWSER_BIN" >> "$GITHUB_ENV"
          "$BROWSER_BIN" --version
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build isolated baseline and candidate wheels
        run: |
          git worktree add --detach "$RUNNER_TEMP/drissionmcp-0.8.8" 30e8adf
          python -m build --wheel --outdir "$RUNNER_TEMP/candidate-dist"
          python -m build --wheel \
            --outdir "$RUNNER_TEMP/baseline-dist" \
            "$RUNNER_TEMP/drissionmcp-0.8.8"
          python -m venv --system-site-packages "$RUNNER_TEMP/baseline-benchmark"
          python -m venv --system-site-packages "$RUNNER_TEMP/candidate-benchmark"
          "$RUNNER_TEMP/baseline-benchmark/bin/python" -m pip install \
            --no-cache-dir --no-deps "$RUNNER_TEMP"/baseline-dist/*.whl
          "$RUNNER_TEMP/candidate-benchmark/bin/python" -m pip install \
            --no-cache-dir --no-deps "$RUNNER_TEMP"/candidate-dist/*.whl
      - name: Compare packaged snapshot search through real stdio
        env:
          DP_HEADLESS: "1"
          DP_NO_SANDBOX: "1"
          DP_MCP_REQUIRE_BROWSER: "1"
          TMPDIR: ${{ runner.temp }}
        run: |
          python -m tests.evals.snapshot_search_comparison \
            --baseline-python "$RUNNER_TEMP/baseline-benchmark/bin/python" \
            --baseline-artifact "$RUNNER_TEMP"/baseline-dist/*.whl \
            --candidate-python "$RUNNER_TEMP/candidate-benchmark/bin/python" \
            --candidate-artifact "$RUNNER_TEMP"/candidate-dist/*.whl \
            --iterations 20
      - name: Run W01-W08 ten-run reliability benchmark
        env:
          DP_HEADLESS: "1"
          DP_NO_SANDBOX: "1"
          DP_MCP_REQUIRE_BROWSER: "1"
          TMPDIR: ${{ runner.temp }}
        run: |
          python -m tests.evals.task_completion_benchmark \
            --iterations 10 \
            --output benchmark-results/0.9.0-task-completion.json
          python -m tests.evals.challenge_surface_benchmark \
            --iterations 10 \
            --output benchmark-results/0.9.0-challenge-surfaces.json
      - name: Upload task-completion benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0.9.0-browser-benchmarks
          path: benchmark-results/0.9.0-*.json
          if-no-files-found: warn

  browser-boundaries:
    name: Input and document boundaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            no_sandbox: "1"
          - os: macos-latest
            no_sandbox: "0"
          - os: windows-latest
            no_sandbox: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Locate Chrome or Chromium (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER_BIN" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
            BROWSER_BIN="$(command -v chromium || command -v chromium-browser || true)"
          fi
          test -n "$BROWSER_BIN"
          echo "CHROME_PATH=$BROWSER_BIN" >> "$GITHUB_ENV"
          "$BROWSER_BIN" --version
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify browser launch (Linux)
        if: runner.os == 'Linux'
        env:
          DP_HEADLESS: "1"
          DP_NO_SANDBOX: ${{ matrix.no_sandbox }}
        run: drissionpage-mcp doctor --launch-browser
      - name: Run focused browser capability boundaries
        env:
          DP_HEADLESS: "1"
          DP_NO_SANDBOX: ${{ matrix.no_sandbox }}
          DP_MCP_REQUIRE_BROWSER: "1"
        run: |
          python -m pytest \
            tests/test_browser_capability_boundaries.py \
            tests/test_observation_browser.py \
            -q

  coverage:
    name: Coverage and browser integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DP_TEST_SITE_URL: http://127.0.0.1:4321
      RUN_PRIVATE_TEST_SITE: ${{ github.event_name != 'pull_request' && secrets.DP_PRIVATE_FIXTURE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout shared DrissionPage test site
        uses: actions/checkout@v4
        with:
          repository: jumodada/DrissionPage-test-site
          path: DrissionPage-test-site
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Locate Chrome or Chromium
        run: |
          BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER_BIN" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
            BROWSER_BIN="$(command -v chromium || command -v chromium-browser || true)"
          fi
          test -n "$BROWSER_BIN"
          echo "CHROME_PATH=$BROWSER_BIN" >> "$GITHUB_ENV"
          "$BROWSER_BIN" --version
      - name: Set up Node for shared test site
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: DrissionPage-test-site/package-lock.json
      - name: Build shared DrissionPage test site
        working-directory: DrissionPage-test-site
        run: |
          npm ci
          npm run build
      - name: Start shared DrissionPage test site
        working-directory: DrissionPage-test-site
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 4321 > "$RUNNER_TEMP/drissionpage-test-site.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/drissionpage-test-site.pid"
          for _ in $(seq 1 60); do
            if curl -fsS "$DP_TEST_SITE_URL/api/health.json" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/drissionpage-test-site.log"
          exit 1
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Tool registry smoke
        run: python playground/run_mcp_lab.py --case registry --json
      - name: Run tests with coverage
        env:
          DP_HEADLESS: "1"
          DP_NO_SANDBOX: "1"
          DP_MCP_REQUIRE_BROWSER: "1"
        run: |
          python -m pytest tests/ \
            --cov=drissionpage_mcp \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml
      - name: Run private shared DrissionPage test-site smoke
        if: ${{ env.RUN_PRIVATE_TEST_SITE == 'true' }}
        env:
          DP_HEADLESS: "1"
          DP_NO_SANDBOX: "1"
          DP_MCP_REQUIRE_BROWSER: "1"
          DP_TEST_SITE_URL: ${{ secrets.DP_PRIVATE_FIXTURE_URL }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import parse_qsl, urlsplit

          url = os.environ["DP_TEST_SITE_URL"].strip()
          parsed = urlsplit(url)
          tokens = {url, parsed.netloc}
          if parsed.scheme and parsed.netloc:
              tokens.add(f"{parsed.scheme}://{parsed.netloc}")
          for key, value in parse_qsl(parsed.query, keep_blank_values=True):
              key = key.lower()
              if value and (
                  len(value) > 12
                  or "secret" in key
                  or "token" in key
                  or "key" in key
                  or "bypass" in key
                  or "sig" in key
              ):
                  tokens.add(value)
          for token in sorted(token for token in tokens if token):
              print(f"::add-mask::{token}")
          PY
          python -m pytest tests/test_browser_integration.py -k shared_drissionpage_test_site -q
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: all-tests
          name: python-3.11
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  wheel-smoke:
    name: Fresh wheel install and browser stdio smoke
    runs-on: ubuntu-latest
    needs: package
    env:
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Locate Chrome or Chromium
        run: |
          BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER_BIN" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
            BROWSER_BIN="$(command -v chromium || command -v chromium-browser || true)"
          fi
          test -n "$BROWSER_BIN"
          echo "CHROME_PATH=$BROWSER_BIN" >> "$GITHUB_ENV"
          "$BROWSER_BIN" --version
      - name: Download verified package artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist/
      - name: Verify package artifact hashes
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          VENV_PYTHON="$RUNNER_TEMP/wheel-smoke/bin/python"
          "$VENV_PYTHON" -m pip install --no-cache-dir --upgrade pip
          "$VENV_PYTHON" -m pip install --no-cache-dir dist/*.whl
          echo "WHEEL_SMOKE_PYTHON=$VENV_PYTHON" >> "$GITHUB_ENV"
      - name: Verify resolved SDK and doctor server wiring
        run: |
          cd "$RUNNER_TEMP"
          "$WHEEL_SMOKE_PYTHON" - <<'PY'
          from pathlib import Path
          from importlib.metadata import version

          import drissionpage_mcp
          from drissionpage_mcp.doctor import run_diagnostics

          mcp_version = version("mcp")
          assert mcp_version.split(".", 1)[0] == "1", mcp_version
          assert version("drissionpage-mcp") == "0.9.0"
          assert "site-packages" in str(Path(drissionpage_mcp.__file__).resolve())
          report = run_diagnostics()
          checks = {item["name"]: item for item in report["checks"]}
          assert checks["mcp_supported"]["ok"], checks["mcp_supported"]
          assert checks["mcp_server_wiring"]["ok"], checks["mcp_server_wiring"]
          assert checks["package_metadata"]["ok"], checks["package_metadata"]
          assert checks["package_import"]["detail"].endswith("source_tree=no"), checks["package_import"]
          assert checks["public_surface"]["detail"] == "69 tools, 0 prompts, 1 resource"
          PY
      - name: Complete wheel browser flow through real stdio
        env:
          DP_HEADLESS: "1"
          DP_NO_SANDBOX: "1"
          DP_MCP_REQUIRE_BROWSER: "1"
        run: |
          cd "$RUNNER_TEMP"
          "$WHEEL_SMOKE_PYTHON" "$GITHUB_WORKSPACE/playground/package_smoke.py" \
            --expected-version 0.9.0

  package:
    name: Package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Locate Chrome or Chromium
        run: |
          BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER_BIN" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
            BROWSER_BIN="$(command -v chromium || command -v chromium-browser || true)"
          fi
          test -n "$BROWSER_BIN"
          echo "CHROME_PATH=$BROWSER_BIN" >> "$GITHUB_ENV"
          "$BROWSER_BIN" --version
      - name: Install build tools
        run: python -m pip install -e ".[dev]"
      - name: Build package
        run: python -m build
      - name: Check wheel package contents
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists
          with zipfile.ZipFile(wheels[0]) as wheel:
              wheel_names = wheel.namelist()
              top_level_file = next(
                  name for name in wheel_names if name.endswith(".dist-info/top_level.txt")
              )
              top_level = wheel.read(top_level_file).decode().splitlines()
          with tarfile.open(sdists[0], "r:gz") as sdist:
              sdist_names = sdist.getnames()

          assert top_level == ["drissionpage_mcp"], top_level
          assert not any(name == "src/" or name.startswith("src/") for name in wheel_names)

          forbidden_suffixes = (
              "/AGENTS.md",
              "/SKILL.md",
              "/docs/core-and-skills-strategy.md",
              "/docs/0.7.3-to-0.8.0-capability-plan.md",
              "/docs/0.9.0-field-evaluation-and-roadmap.md",
              "/drissionpage_mcp/prompts.py",
              "/drissionpage_mcp/browser/vision.py",
              "/drissionpage_mcp/browser/workflows.py",
              "/drissionpage_mcp/tools/vision.py",
              "/drissionpage_mcp/tools/workflow.py",
              "/docs/skills.md",
          )
          for names in (wheel_names, sdist_names):
              assert not any(
                  ("/" + name).endswith(forbidden_suffixes)
                  or "/skills/" in ("/" + name)
                  or "/.omx/" in ("/" + name)
                  for name in names
              ), names
          PY
      - name: Install sdist in a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/sdist-smoke"
          SDIST_PYTHON="$RUNNER_TEMP/sdist-smoke/bin/python"
          "$SDIST_PYTHON" -m pip install --no-cache-dir dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$SDIST_PYTHON" - <<'PY'
          from importlib.metadata import version

          from drissionpage_mcp.doctor import run_diagnostics

          assert version("drissionpage-mcp") == "0.9.0"
          report = run_diagnostics()
          checks = {item["name"]: item for item in report["checks"]}
          assert report["ok"], report
          assert checks["package_import"]["detail"].endswith("source_tree=no")
          assert checks["package_metadata"]["ok"]
          assert checks["public_surface"]["detail"] == "69 tools, 0 prompts, 1 resource"
          PY
          echo "SDIST_SMOKE_PYTHON=$SDIST_PYTHON" >> "$GITHUB_ENV"
      - name: Complete sdist browser flow through real stdio
        env:
          DP_HEADLESS: "1"
          DP_NO_SANDBOX: "1"
          DP_MCP_REQUIRE_BROWSER: "1"
        run: |
          cd "$RUNNER_TEMP"
          "$SDIST_SMOKE_PYTHON" "$GITHUB_WORKSPACE/playground/package_smoke.py" \
            --expected-version 0.9.0
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Create distribution hashes
        working-directory: dist
        run: sha256sum -- ./*.whl ./*.tar.gz > SHA256SUMS
      - name: Upload verified distribution
        uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/
          if-no-files-found: error
