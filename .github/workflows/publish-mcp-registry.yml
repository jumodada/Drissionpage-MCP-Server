name: Publish package and MCP Registry entry

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-metadata:
    name: Verify tag and release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify all release versions before gates
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          python - "$VERSION" <<'PY'
          import ast
          import json
          import sys
          import tomllib
          from pathlib import Path

          version = sys.argv[1]
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          server = json.loads(Path("server.json").read_text(encoding="utf-8"))
          module = ast.parse(Path("drissionpage_mcp/__init__.py").read_text(encoding="utf-8"))
          module_version = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__"
                      for target in node.targets)
          )
          assert pyproject["project"]["version"] == version
          assert module_version == version
          assert server["version"] == version
          for package in server["packages"]:
              assert package["version"] == version
          PY

  quality-gates:
    name: Complete CI release gates
    needs: release-metadata
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  verify-and-build:
    name: Verify tested release artifacts
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install verification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate pinned remote Skills release sources
        run: python playground/validate_skills.py --json --remote
      - name: Download tested distribution
        uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist/
      - name: Verify tested distribution hashes
        working-directory: dist
        run: sha256sum --check SHA256SUMS

  publish-pypi:
    name: Publish to PyPI
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/drissionpage-mcp
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist/
      - name: Verify exact artifacts before PyPI upload
        working-directory: dist
        run: |
          sha256sum --check SHA256SUMS
          rm SHA256SUMS
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Wait for the PyPI release to become queryable
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          for ((attempt = 1; attempt <= 24; attempt++)); do
            if curl --fail --silent --show-error \
              "https://pypi.org/pypi/drissionpage-mcp/${VERSION}/json" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "PyPI did not expose drissionpage-mcp ${VERSION} within two minutes."
          exit 1
      - name: Install MCP Registry publisher
        run: |
          curl -L \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
      - name: Publish with GitHub OIDC
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
